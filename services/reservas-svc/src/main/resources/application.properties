spring.application.name=reservas-svc
server.port=8080

# ── MongoDB ────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:rootpwd}@${MONGO_HOST:mongodb}:27017/${MONGO_DB:reservas}?authSource=admin
spring.data.mongodb.auto-index-creation=true

# ── RabbitMQ ───────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.amqp.deserialization.trust.all=true

logging.level.edu.utn.frsf.isi.dan.reservas_svc=DEBUG

# Management and Metrics
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0

# Logging with Trace ID correlation
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %msg%n

# OpenTelemetry Configuration (Spring Boot 3.5 native OTLP support)
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
management.otlp.tracing.transport=http
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.metrics.export.transport=http
management.otlp.logging.endpoint=http://otel-collector:4318/v1/logs
management.otlp.logging.transport=http
