spring.application.name=gestion-svc

# ── springdoc-openapi ─────────────────────────────────────────────
springdoc.default-flat-param-object=true

# ── Configuración PostgreSQL ──────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:appdb}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:apppwd}
server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Configuración Hikari ──────────────────────────────────────────
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=8

# ── Configuración Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Configuración RabbitMQ ────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

rabbitmq.exchange=dan.exchange
rabbitmq.routingkey=dan.habitacion.#

logging.level.edu.utn.frsf.isi.dan.gestion=DEBUG

# Management and Metrics
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0

# Logging with Trace ID correlation
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %msg%n

# OpenTelemetry Configuration (Spring Boot 3.5 native OTLP support)
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
management.otlp.tracing.transport=http
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.metrics.export.transport=http
management.otlp.logging.endpoint=http://otel-collector:4318/v1/logs
management.otlp.logging.transport=http
