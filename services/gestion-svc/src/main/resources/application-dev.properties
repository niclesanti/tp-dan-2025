spring.application.name=gestion-svc

# ── springdoc-openapi (Development - habilitado) ─────────────────
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.enabled=true

# ── Configuración PostgreSQL (Development) ───────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:appdb}
spring.datasource.username=${POSTGRES_USER:appuser}
spring.datasource.password=${POSTGRES_PASSWORD:apppwd}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Configuración Hikari (Development) ───────────────────────────
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=8
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# ── Configuración Hibernate (Development - verbose) ───────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ── Configuración RabbitMQ (Development) ─────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

rabbitmq.exchange=dan.exchange
rabbitmq.routingkey=dan.habitacion.#

# ── Logging (Development) ────────────────────────────────────────
logging.level.root=INFO
logging.level.edu.utn.frsf.isi.dan=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %msg%n

# ── Actuator (Development - todos los endpoints expuestos) ────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true
management.endpoint.shutdown.enabled=true

# ── Server Configuration ─────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=always
