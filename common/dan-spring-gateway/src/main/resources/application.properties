spring.application.name=dan-spring-gateway
server.port=8080
spring.cloud.gateway.server.webmvc.enabled=true
spring.main.web-application-type=servlet

spring.cloud.gateway.server.webmvc.routes[0].id=user-svc
spring.cloud.gateway.server.webmvc.routes[0].uri=http://user-svc:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=reservas-svc
spring.cloud.gateway.server.webmvc.routes[1].uri=http://reservas-svc:8080
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/reservas/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=gestion-svc
spring.cloud.gateway.server.webmvc.routes[2].uri=http://gestion-svc:8080
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/gestion/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Rutas adicionales para servicios no cubiertos por las rutas principales
spring.cloud.gateway.server.webmvc.routes[3].id=bancos-svc
spring.cloud.gateway.server.webmvc.routes[3].uri=http://user-svc:8080
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/bancos/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[4].id=habitaciones-svc
spring.cloud.gateway.server.webmvc.routes[4].uri=http://reservas-svc:8080
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/habitaciones/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1
# Logging with Trace ID correlation
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %msg%n

# Management and Metrics
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0

# OpenTelemetry Configuration (Spring Boot 3.5 native OTLP support)
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
management.otlp.tracing.transport=http
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.metrics.export.transport=http
management.otlp.logging.endpoint=http://otel-collector:4318/v1/logs
management.otlp.logging.transport=http
