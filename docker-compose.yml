# ╔════════════════════════════════════════════════════════════════════╗
# ║ Docker Compose - Base Configuration                                ║
# ║ Sistema de Gestión Hotelera                                        ║
# ║                                                                    ║
# ║ Uso:                                                               ║
# ║   Development: docker compose up -d --build                        ║
# ║   Production:  docker compose -f docker-compose.yml \              ║
# ║                -f docker-compose.prod.yml up -d --build            ║
# ╚════════════════════════════════════════════════════════════════════╝

# ── Networks ──────────────────────────────────────────────────────
networks:
  tp-dan-network:
    driver: bridge
    name: tp-dan-network

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: tp-dan-mysql-data
    driver: local
  postgres_data:
    name: tp-dan-postgres-data
    driver: local
  pgadmin_data:
    name: tp-dan-pgadmin-data
    driver: local
  mongo_data:
    name: tp-dan-mongo-data
    driver: local

# ── Services ──────────────────────────────────────────────────────
services:
  
  # ── MySQL Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.3
    container_name: tp-dan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-users}
      MYSQL_USER: ${MYSQL_USER:-usr_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-usrapp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpwd}
      TZ: America/Argentina/Cordoba
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/initdb/:/docker-entrypoint-initdb.d/:ro
    networks:
      - tp-dan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpwd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── PHPMyAdmin ──────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tp-dan-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-usr_app}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-usrapp}
    networks:
      - tp-dan-network
    depends_on:
      mysql:
        condition: service_healthy

  # ── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: tp-dan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppwd}
      TZ: America/Argentina/Cordoba
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb/:/docker-entrypoint-initdb.d/:ro
    networks:
      - tp-dan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PgAdmin ──────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tp-dan-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/config/servers/:/pgadmin4/servers/:ro
    networks:
      - tp-dan-network
    depends_on:
      postgres:
        condition: service_healthy

  # ── RabbitMQ ─────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tp-dan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - tp-dan-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── User Service ────────────────────────────────────────────────
  user-svc:
    build:
      context: .
      dockerfile: services/user-svc/Dockerfile
    container_name: tp-dan-user-svc
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-users}
      MYSQL_USER: ${MYSQL_USER:-usr_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-usrapp}
    networks:
      - tp-dan-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Gestion Service ─────────────────────────────────────────────
  gestion-svc:
    build:
      context: .
      dockerfile: services/gestion-svc/Dockerfile
    container_name: tp-dan-gestion-svc
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    networks:
      - tp-dan-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── MongoDB Database ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: tp-dan-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-reservas}
      TZ: America/Argentina/Cordoba
    volumes:
      - mongo_data:/data/db
    networks:
      - tp-dan-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Mongo Express ───────────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: tp-dan-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-rootpwd}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-rootpwd}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - tp-dan-network
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Reservas Service ────────────────────────────────────────────
  reservas-svc:
    build:
      context: .
      dockerfile: services/reservas-svc/Dockerfile
    container_name: tp-dan-reservas-svc
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      MONGO_HOST: mongodb
      MONGO_USER: ${MONGO_USER:-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-rootpwd}
      MONGO_DB: ${MONGO_DB:-reservas}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
    networks:
      - tp-dan-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── API Gateway ───────────────────────────────────────────────
  dan-gateway:
    build:
      context: .
      dockerfile: common/dan-spring-gateway/Dockerfile
    container_name: tp-dan-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
    networks:
      - tp-dan-network
    depends_on:
      user-svc:
        condition: service_healthy
      reservas-svc:
        condition: service_healthy
      gestion-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
