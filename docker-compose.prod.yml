# ╔════════════════════════════════════════════════════════════════════╗
# ║ Docker Compose - Production Configuration                         ║
# ║                                                                    ║
# ║ Uso: docker compose -f docker-compose.yml \                       ║
# ║      -f docker-compose.prod.yml up -d --build                      ║
# ║                                                                    ║
# ║ Características de producción:                                    ║
# ║ - Sin puertos expuestos innecesariamente                           ║
# ║ - Límites de recursos definidos                                    ║
# ║ - Logs optimizados                                                 ║
# ║ - Mayor seguridad                                                  ║
# ║ - Healthchecks más frecuentes                                      ║
# ╚════════════════════════════════════════════════════════════════════╝

services:
  
  # ── MySQL (Production) ──────────────────────────────────────────
  mysql:
    # NO exponemos el puerto 3306 al host en producción
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password  # Más seguro
      - --log-error-verbosity=2  # Logs moderados
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=128M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── PHPMyAdmin (Production) ─────────────────────────────────────
  # En producción, se recomienda NO exponer PHPMyAdmin o usar VPN/Túnel SSH
  phpmyadmin:
    profiles:
      - admin  # Solo se levanta con: docker compose --profile admin up
    environment:
      PMA_ABSOLUTE_URI: https://admin.yourcompany.com/phpmyadmin/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── User Service (Production) ───────────────────────────────────
  user-svc:
    ports:
      - "8081:8080"  # En producción real, usar reverse proxy (nginx/traefik)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # JVM optimizado para producción
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heap_dump.hprof
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    volumes:
      - ./services/user-svc/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
